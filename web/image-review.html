<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>ResumeRAGbot｜作品圖片校對</title>
<style>
  :root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#193d34;background:#f4f6f2;font-size:16px}
  *{box-sizing:border-box}body{margin:0}main{max-width:1120px;margin:auto;padding:30px 22px 64px}
  header{padding:30px;border-radius:20px;background:#173f35;color:#fff}header p{max-width:780px;color:#dbe9df;line-height:1.8;margin-bottom:0}
  h1{font-size:clamp(25px,4vw,35px);line-height:1.4;margin:8px 0}h2{font-size:21px;margin:0 0 12px}h3{font-size:16px;margin:12px 0 6px}
  .eyebrow{color:#b7d6bd;font-size:13px;letter-spacing:.09em}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0;align-items:center}
  button{font:inherit;border:1px solid #c7d8cc;border-radius:9px;padding:10px 15px;background:#fff;color:#214d3f;cursor:pointer}
  button.primary{background:#236a50;border-color:#236a50;color:#fff}button:disabled{opacity:.5;cursor:default}button:hover:enabled{filter:brightness(.96)}
  button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid #b47825;outline-offset:3px}
  #status{padding:15px 18px;background:#fff7df;border:1px solid #e5d29d;border-radius:10px;line-height:1.7;margin-bottom:18px}
  #status.error{background:#fff0ec;border-color:#d9a79e;color:#8b362d}#status.success{background:#eaf4e8;border-color:#bdd4b7}
  .summary{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0;color:#4e665b;font-size:14px}.badge{border-radius:20px;background:#e6efe6;padding:6px 11px}
  .card{margin-top:22px;border:1px solid #d7e2d9;border-radius:16px;background:#fff;overflow:hidden}.card-head{padding:22px 25px 4px}.card-head p{color:#617267;font-size:13px;overflow-wrap:anywhere}
  .grid{display:grid;grid-template-columns:minmax(230px,40%) minmax(0,1fr);gap:26px;padding:18px 25px 26px}.image-box{background:#eef1eb;border-radius:10px;min-height:220px;padding:12px;display:flex;align-items:center;justify-content:center}
  .image-box img{width:100%;height:auto;max-height:570px;object-fit:contain;display:block}.image-box .loading{color:#617267;font-size:14px}
  label.field{display:block;font-size:15px;font-weight:650;margin-bottom:15px}textarea{display:block;margin-top:7px;width:100%;min-height:115px;resize:vertical;border:1px solid #b9cbbd;border-radius:8px;padding:11px;font:14px/1.7 system-ui,sans-serif;color:#233b31}
  .hint{font-size:13px;line-height:1.75;color:#66756b}.actions{display:flex;gap:9px;flex-wrap:wrap}.actions button{font-size:14px}details{margin-top:18px;font-size:14px}summary{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.7 system-ui,sans-serif;color:#4a5e51}
  .sharing{border-top:1px solid #e0e7df;padding-top:16px;margin-top:20px}.consent{display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:1.6;margin-bottom:12px}.consent input{margin-top:5px;width:17px;height:17px;flex-shrink:0}
  .empty{padding:35px;text-align:center;background:white;border-radius:16px;border:1px solid #d7e2d9;line-height:1.8}a{color:#236a50}#more{margin-top:20px}
  @media(max-width:700px){main{padding:16px 13px 40px}header{padding:23px}.grid{grid-template-columns:1fr;padding:15px 19px 22px;gap:18px}.card-head{padding:20px 19px 0}.image-box img{max-height:420px}}
</style>
</head>
<body>
<main>
  <header><div class="eyebrow">RESUMERAGBOT · 主人管理介面</div><h1>讓作品圖片的內容，成為可靠的履歷答案</h1>
    <p>對照原圖校對文字與畫面描述，再逐張選擇是否開放 LINE 作品預覽。校對資料另外保存，原履歷文字與圖片保持不變。</p></header>
  <div class="toolbar"><button id="reload" disabled>重新載入</button><button id="sync" class="primary" disabled>同步知識庫</button><button id="validate" disabled>檢查 LINE 作品卡片</button><button id="deployment" disabled>檢查部署版本</button><button id="close" disabled>結束管理</button></div>
  <div id="status" role="status" aria-live="polite">正在確認管理連結…</div>
  <div id="summary" class="summary"></div>
  <div id="images"></div>
  <button id="more" hidden>顯示更多作品</button>
  <p class="hint">此管理連結有效 20 分鐘，僅供本人使用。到期後回到 GAS 執行 openImageReview，取得新的連結。</p>
</main>
<script>
(() => {
  'use strict';
  let token = '', data = null, busy = false, visible = 10, expiryTimer;
  const dirty = new Set();
  const $ = id => document.getElementById(id);
  const messages = {
    REVIEW_SESSION_EXPIRED:'管理連結已失效。請回到 GAS 執行 openImageReview，開啟新的管理連結。',
    REVIEW_CONFLICT:'資料已在另一個管理頁更新。請先捨棄此頁未儲存的修改，再重新載入。',
    REVIEW_IMAGE_NOT_PUBLIC:'這張圖片已換圖或移出履歷公開區。請重新載入，不會套用舊圖片的設定。',
    REVIEW_INVALID_INPUT:'校對內容格式不正確，或單一欄位超過 12,000 字。請精簡後再儲存。',
    REVIEW_SYNC_BUSY:'目前有同步工作正在執行，請等完成後再儲存或同步。',
    MISSING_GEMINI_API_KEY:'請先在 GAS 填入自己的 Gemini API Key，再同步知識庫。',
    PORTFOLIO_PUBLISH_FAILED:'無法開放作品預覽。請確認自己的 Google 帳號允許以連結分享檔案。',
    PORTFOLIO_IMAGE_NOT_READY:'Google Drive 尚未提供圖片預覽。副本目前保留為私有，請稍後重試。',
    PORTFOLIO_IMAGE_INVALID:'圖片預覽未通過格式檢查，未開放分享。請確認原圖為清楚可預覽的圖片。',
    PORTFOLIO_IMAGE_DIMENSIONS:'圖片預覽尺寸不符合 LINE 要求，未開放分享。請縮小原圖後重新同步。',
    PORTFOLIO_ASSET_OWNERSHIP:'作品副本資料不一致，已停止變更分享權限。請到 Drive 核對這個專案產生的作品副本。',
    PORTFOLIO_REVOKE_FAILED:'新的作品卡片已停用，但 Drive 分享權限尚未撤回成功。請到 Drive 檢查作品副本的分享設定。',
    PORTFOLIO_STORE_NOT_PRIVATE:'作品管理資料檔的分享權限不正確，請將管理 JSON 檔設為私有後重試。',
    PORTFOLIO_STORE_OWNER:'管理資料檔不是執行帳號本人擁有，已停止讀取。請使用自己的 Drive 管理資料。',
    PORTFOLIO_STORE_UNAVAILABLE:'無法讀取作品管理資料，請確認 Drive 中的管理檔未被刪除。',
    PORTFOLIO_NO_PUBLIC_IMAGES:'請先開放至少一張作品預覽，再檢查 LINE 卡片。',
    IMAGE_PREVIEW_NEEDS_SYNC:'圖片索引尚未就緒，請先按「同步知識庫」。',
    MISSING_LINE_CHANNEL_ACCESS_TOKEN:'請先在 GAS 填入自己的 LINE Channel access token，再檢查卡片。',
    LINE_CARD_VALIDATION_400:'LINE 尚未接受作品卡片格式，請檢查公開圖片後重試，或將錯誤回報給老師。',
    LINE_CARD_VALIDATION_401:'LINE Token 驗證失敗，請檢查自己的 Channel access token。',
    LINE_CARD_VALIDATION_403:'LINE Token 或頻道權限不足，請確認使用自己的 Messaging API 頻道。',
    DEPLOYMENT_VERSION_MISMATCH:'編輯器與正式部署版本不同。請先回到 GAS 更新原部署，再重新開啟管理介面。',
    SET_PUBLIC_WEB_APP_URL:'請到 GAS 指令碼屬性填入自己的正式 /exec 網址，名稱為 WEB_APP_URL；不能使用 /dev 或自行改寫網址。',
    GEMINI_HTTP_429:'Google Gemini API 的額度或呼叫頻率已達限制。請稍後按「同步知識庫」。',
    GEMINI_HTTP_403:'Gemini 權限驗證失敗。請檢查 API Key 的專案權限，再同步。',
    QUICK_TOPICS_INVALID:'AI 產生的代表主題格式不正確，請重新同步。',
    QUICK_TOPICS_OVERLAP:'AI 產生的主題名稱或來源有重疊，請重新同步，程式沒有採用這份選單。',
    QUICK_TOPICS_INCOMPLETE:'AI 沒有完整分類履歷內容，請重新同步。',
    SOURCE_CHANGED_DURING_SYNC:'同步途中履歷內容有變動。請確認文件儲存完成後，再按「同步知識庫」。',
    SOURCE_TOO_LARGE:'辨識後的知識庫超過可處理大小，請精簡校對文字或履歷內容後重新同步。'
  };
  function el(tag, text, cls) { const node=document.createElement(tag); if(text!==undefined)node.textContent=text;if(cls)node.className=cls;return node; }
  function status(text, kind='') { $('status').textContent=text;$('status').className=kind; }
  function controls() {
    document.querySelectorAll('button,textarea,input').forEach(node=>{node.disabled=busy||!token;});
    if(dirty.size){
      ['reload','sync','validate','deployment','close','more'].forEach(id=>{$(id).disabled=true;});
      document.querySelectorAll('article').forEach(card=>{
        if(!dirty.has(card.dataset.digest))card.querySelectorAll('button,textarea,input').forEach(node=>{node.disabled=true;});
      });
    }
  }
  function rpc(method, ...args) {
    return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[method](token,...args));
  }
  function fail(error) {
    const raw=String(error&&error.message||error),code=Object.keys(messages).find(key=>raw.includes(key));
    status(code?messages[code]:'操作尚未完成，請稍後重試；若持續失敗，請到 GAS 查看執行記錄。','error');
    if(code==='REVIEW_SESSION_EXPIRED')expire();
  }
  function expire() {
    token='';data=null;dirty.clear();$('images').replaceChildren();$('summary').replaceChildren();$('more').hidden=true;
    controls();status(messages.REVIEW_SESSION_EXPIRED,'error');
  }
  async function run(action) { if(busy||!token)return;busy=true;controls();try{await action();}catch(error){fail(error);}finally{busy=false;controls();} }
  async function load(note) {
    data=await rpc('getImageReviewData');dirty.clear();visible=10;render();
    clearTimeout(expiryTimer);expiryTimer=setTimeout(expire,Math.max(1,data.expiresAt-Date.now()));
    if(note)status(note,'success');else status(data.indexReady?'圖片索引已就緒。可校對內容，或開放作品預覽。':'圖片索引尚未就緒。請先同步知識庫，再核對辨識結果。');
  }
  function render() {
    $('summary').replaceChildren(el('span','程式 '+data.version,'badge'),el('span',data.images.length+' 張公開區圖片','badge'),el('span',data.indexReady?'索引已就緒':'等待同步','badge'));
    if(data.topics&&data.topics.length)data.topics.forEach(topic=>$('summary').append(el('span',topic.label,'badge')));
    $('images').replaceChildren();
    if(!data.images.length)$('images').append(el('div','目前公開區沒有圖片。請在原履歷的公開標記之間插入作品圖片，再重新載入。','empty'));
    data.images.slice(0,visible).forEach(renderImage);$('more').hidden=visible>=data.images.length;
  }
  function renderImage(item) {
    const article=el('article',undefined,'card');article.dataset.digest=item.digest;
    const head=el('div',undefined,'card-head');head.append(el('h2',item.title),el('p',item.reviewed?'已套用主人校對':'使用 AI 原始辨識'));article.append(head);
    const grid=el('div',undefined,'grid'),imageBox=el('div',undefined,'image-box'),loading=el('span','載入原圖…','loading');imageBox.append(loading);
    rpc('getImageReviewImage',item.digest).then(result=>{if(!token||!article.isConnected)return;const img=el('img');img.alt=item.title;img.src=result.dataUrl;imageBox.replaceChildren(img);}).catch(error=>{loading.textContent='原圖暫時無法載入。';fail(error);});
    const form=el('div'),transLabel=el('label','圖片文字','field'),trans=el('textarea');trans.value=item.transcription;trans.maxLength=12000;trans.setAttribute('aria-label',item.title+' 圖片文字');transLabel.append(trans);
    const visualLabel=el('label','畫面描述','field'),visual=el('textarea');visual.value=item.visualDescription;visual.maxLength=12000;visual.setAttribute('aria-label',item.title+' 畫面描述');visualLabel.append(visual);
    form.append(transLabel,visualLabel,el('p','描述可見的構圖、配色、物件或介面元件。作者、使用技術及實際成效，請以本人確認的履歷資料為準。','hint'));
    const actions=el('div',undefined,'actions'),save=el('button','儲存校對並同步','primary'),discard=el('button','捨棄未儲存修改'),reset=el('button','還原 AI 辨識並同步');
    [trans,visual].forEach(field=>field.addEventListener('input',()=>{dirty.add(item.digest);status('有尚未儲存的校對。請儲存，或按「捨棄未儲存修改」。');controls();}));
    discard.addEventListener('click',()=>{trans.value=item.transcription;visual.value=item.visualDescription;dirty.delete(item.digest);controls();status('已捨棄這張圖片尚未儲存的修改。');});
    async function saveReview(resetValue) {
      const result=await rpc('saveImageReview',item.digest,{reset:resetValue,transcription:trans.value,visualDescription:visual.value},data.reviewRevision);
      dirty.delete(item.digest);await load(result.synced?'校對已保存並完成同步，LINE 將使用新的內容回答。':undefined);
      if(!result.synced){fail(new Error(result.error||'同步尚未完成，請稍後再試。'));if(token)$('status').prepend('校對已保存，尚未同步成功。');}
    }
    save.addEventListener('click',()=>run(()=>saveReview(false)));reset.addEventListener('click',()=>run(()=>saveReview(true)));actions.append(save,discard,reset);form.append(actions);
    const original=el('details'),summary=el('summary','查看 AI 原始辨識'),raw=el('pre','圖片文字：\n'+(item.originalTranscription||'（沒有可見文字）')+'\n\n畫面描述：\n'+(item.originalVisualDescription||'（尚未辨識）'));original.append(summary,raw);form.append(original);
    const sharing=el('div',undefined,'sharing'),isPublic=item.sharing==='public',needsRevoke=item.sharing==='revoke_failed';sharing.append(el('h3',needsRevoke?'LINE 作品預覽：分享撤回尚未完成':isPublic?'LINE 作品預覽：已開放':'LINE 作品預覽：未開放'));
    const consent=el('label',undefined,'consent'),check=el('input');check.type='checkbox';consent.append(check,el('span','我同意將這張作品的獨立副本設為持連結者可讀，供 LINE 顯示圖片。原履歷文件與索引維持私有。'));
    if(!isPublic&&!needsRevoke)sharing.append(consent);
    const shareButton=el('button',needsRevoke?'重試撤回公開預覽':isPublic?'撤回公開預覽':item.sharing==='preparing'?'重試開放預覽':'開放作品預覽');
    shareButton.addEventListener('click',()=>run(async()=>{
      if(dirty.has(item.digest)){status('請先儲存或捨棄這張圖片的校對，再調整預覽。','error');return;}
      if(!isPublic&&!needsRevoke&&!check.checked){status('請先勾選作品副本的公開預覽同意項目。','error');return;}
      await rpc('setPortfolioImageSharing',item.digest,!isPublic&&!needsRevoke);await load(isPublic||needsRevoke?'已停止產生這張作品的新圖文卡片，並撤回 Drive 副本的公開分享。':'作品預覽已開放。到 LINE 輸入「作品圖庫」即可查看。');
    }));sharing.append(shareButton,el('p','撤回後不再產生新的作品卡片；已傳送、下載或由 LINE 快取的圖片可能保留。','hint'));
    if(item.publicCopyUrl){const link=el('a','在 Drive 查看作品副本');link.href=item.publicCopyUrl;link.target='_blank';link.rel='noopener noreferrer';sharing.append(link);}
    form.append(sharing);grid.append(imageBox,form);article.append(grid);$('images').append(article);
  }
  $('reload').addEventListener('click',()=>run(()=>load()));
  $('sync').addEventListener('click',()=>run(async()=>{status('正在同步知識庫，請稍候…');const result=await rpc('syncImageReview');if(result.status==='already_running')throw new Error('REVIEW_SYNC_BUSY');await load('同步完成，可以回到 LINE 測試。');}));
  $('validate').addEventListener('click',()=>run(async()=>{const result=await rpc('validatePortfolioCards');status(result.message,'success');}));
  $('deployment').addEventListener('click',()=>run(async()=>{const result=await rpc('checkImageReviewDeployment');status(result.message,result.status==='ready'?'success':'error');}));
  $('close').addEventListener('click',()=>run(async()=>{await rpc('closeImageReview');expire();status('管理連結已結束。需要時可回到 GAS 取得新的連結。');}));
  $('more').addEventListener('click',()=>{visible+=10;render();controls();});
  window.addEventListener('beforeunload',event=>{if(dirty.size){event.preventDefault();event.returnValue='';}});
  if(typeof google==='undefined'||!google.script||!google.script.url){status('請在 GAS 執行 openImageReview，再開啟執行記錄中的管理連結。此頁預覽不含履歷資料。','error');return;}
  google.script.url.getLocation(location=>{
    token=String(location.hash||'').replace(/^#/, '');
    if(!/^[a-f0-9]{64}$/.test(token)){expire();return;}
    run(()=>load());
  });
})();
</script>
</body>
</html>
